[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hometracker"
version = "0.1.0"
description = "Tracker de piață imobiliară: colectează anunțuri, le grupează pe apartamente și trimite alerte."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hometracker = "hometracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
