[project]
name = "hometracker"
version = "0.1.0"
description = "Tracker de piață imobiliară: colectează anunțuri, le grupează pe apartamente și trimite alerte."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.scripts]
hometracker = "hometracker.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Romanian text uses typographic characters on purpose
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["E402"]  # sys.path insertion before importing the scripts under test

[tool.pytest.ini_options]
testpaths = ["tests"]
